services:
  # Web Service basado en Docker para despliegue rápido y predecible
  - type: web
    name: platano-logistica-api
    env: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: PARAMETROS_PATH
        value: config/parametros.yaml
      - key: DATABASE_URL
        fromDatabase:
          name: platano-db
          property: connectionString

databases:
  # Base de datos PostgreSQL gratuita
  - name: platano-db
    plan: free
    databaseName: platano
    user: platano
